<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#eeeae2">

  <meta
    name="description"
    content="The Confidence Code. A more personal approach to fashion."
  >

  <title>The Confidence Code | Coming Soon</title>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- =====================================
         BACKGROUND VISUAL
         Dynamic 3D-inspired sculpture
         ===================================== -->

    <div class="visual-background" aria-hidden="true">

      <div class="ambient-glow glow-one"></div>
      <div class="ambient-glow glow-two"></div>

      <div class="sculpture-container">

        <div class="sculpture">

          <div class="sculpture-ring"></div>

          <div class="sculpture-form form-back"></div>

          <div class="sculpture-form form-main"></div>

          <div class="sculpture-form form-fold"></div>

          <div class="sculpture-highlight"></div>

        </div>

      </div>

    </div>


    <!-- =====================================
         HEADER
         ===================================== -->

    <header class="header">

      <a
        href="#"
        class="brand"
        aria-label="The Confidence Code home"
      >

        <span class="brand-symbol">CC.</span>

        <span class="brand-name">
          THE CONFIDENCE<br>
          CODE
        </span>

      </a>

    </header>


    <!-- =====================================
         MAIN HERO CONTENT
         ===================================== -->

    <section class="hero">

      <div class="hero-content">

        <h1>
          <span class="headline-line">
            FASHION,
          </span>

          <span class="headline-line">
            WITHOUT THE
          </span>

          <span class="headline-line headline-accent">
            RULES<span class="period">.</span>
          </span>
        </h1>


        <!-- Supporting sentence -->

        <p class="hero-description">
          A more personal approach to fashion.
        </p>


        <!-- Coming soon status -->

        <div class="coming-soon">

          <span class="coming-icon"></span>

          <span>COMING SOON</span>

        </div>

      </div>

    </section>


    <!-- =====================================
         SCULPTURE ANNOTATIONS

         Positioned around the 3D figure.
         These are part of the visual identity.
         ===================================== -->

    <div class="visual-annotations">

      <span class="annotation annotation-top-left">
        PERSONAL FASHION, REIMAGINED
      </span>

      <span class="annotation annotation-top-right">
        FASHION SHOULD ADAPT TO YOU.
      </span>

      <span class="annotation annotation-bottom-left">
        FORM / MOVEMENT / IDENTITY
      </span>

      <span class="annotation annotation-bottom-right">
        DESIGNED AROUND INDIVIDUALITY
      </span>

    </div>


    <!-- =====================================
         FOOTER
         ===================================== -->

    <footer class="footer">

      <span>
        THE CONFIDENCE CODE &copy; 2026
      </span>

    </footer>

  </main>

</body>

</html>
