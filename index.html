
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#EEEAE2">

  <title>The Confidence Code | Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">

    <header class="header">
      <a class="brand" href="#" aria-label="The Confidence Code home">
        <span class="brand-symbol" aria-hidden="true">C</span>
        <span class="brand-name">THE CONFIDENCE CODE</span>
      </a>
    </header>

    <section class="hero">

      <div class="hero-content">
        <h1 class="headline">
          FASHION,<br>
          WITHOUT THE<br>
          <span class="headline-accent">RULES<span class="period">.</span></span>
        </h1>

        <p class="hero-description">
          A more personal approach to fashion.
        </p>

        <div class="coming-soon">
          <span class="coming-icon" aria-hidden="true"></span>
          <span>COMING SOON</span>
        </div>
      </div>

      <div class="visual-stage" aria-label="Abstract sculptural form representing individuality and movement">

        <div class="ambient-glow"></div>

        <div class="sculpture-container">

          <div class="sculpture">
            <div class="sculpture-ring"></div>

            <div class="sculpture-form">
              <div class="form-back"></div>
              <div class="form-main"></div>
              <div class="form-fold"></div>
              <div class="sculpture-highlight"></div>
            </div>
          </div>

          <!-- Annotations positioned around the sculpture -->
          <div class="annotation annotation-top-left">
            <span class="annotation-marker"></span>
            <span>PERSONAL FASHION,<br>REIMAGINED</span>
          </div>

          <div class="annotation annotation-top-right">
            <span>FASHION SHOULD<br>ADAPT TO YOU.</span>
            <span class="annotation-marker"></span>
          </div>

          <div class="annotation annotation-bottom-left">
            <span class="annotation-marker"></span>
            <span>FORM / MOVEMENT<br>/ IDENTITY</span>
          </div>

          <div class="annotation annotation-bottom-right">
            <span>DESIGNED AROUND<br>INDIVIDUALITY</span>
            <span class="annotation-marker"></span>
          </div>

        </div>
      </div>

    </section>

    <footer class="footer">
      <span>THE CONFIDENCE CODE © 2026</span>
    </footer>

  </main>
</body>
</html>
